server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta que no sea un archivo real (ej. /admin/envios,
  # /tecnico/formulario/xxx) cae en index.html, para que react-router-dom
  # resuelva la ruta del lado del cliente.
  location / {
    try_files $uri /index.html;
  }
}
